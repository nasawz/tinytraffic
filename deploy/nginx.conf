# tinytraffic behind nginx with HTTPS. Install as /etc/nginx/conf.d/tinytraffic.conf.
# Replace tinytraffic.example.com with your domain.

# Plain HTTP: certificate validation, then everything goes to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name tinytraffic.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tinytraffic.example.com;

    ssl_certificate     /etc/letsencrypt/live/tinytraffic.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tinytraffic.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:5m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=15552000" always;
    client_max_body_size 256k;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Requests by IP address or for other names get nothing.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
